[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-visualizer"
version = "1.0.0"
description = "High-performance fractal visualization and wallpaper generator"
authors = [
    {name = "Fractal Team", email = "fractals@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "streamlit>=1.28.0",
    "numba>=0.58.0",
    "Pillow>=10.0.0",
    "scipy>=1.11.0",
    "colorcet>=3.0.1",
    "tqdm>=4.66.0",
    "plotly>=5.17.0",
    "bokeh>=3.3.0",
    "opencv-python>=4.8.0",
    "imageio>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/fractals/fractal-visualizer"
Documentation = "https://fractal-visualizer.readthedocs.io"
Repository = "https://github.com/fractals/fractal-visualizer.git"

[project.scripts]
fractal-viz = "src.main:main"
fractal-web = "src.web_interface.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true